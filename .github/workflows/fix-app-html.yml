name: Fix tpcpParkOfLand

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          node -e "var fs=require('fs');var c=fs.readFileSync('app.html','utf8');var i=c.indexOf('TPCP_LAND_PARK = {');var e=c.indexOf('\nfunction tpcpTimeToMin');if(i<0||e<0){process.exit(1);}var q=String.fromCharCode(39);var r='TPCP_LAND_PARK_NORM = {\n  '+q+'star wars galaxys edge'+q+': '+q+'DL'+q+',\n  '+q+'adventureland'+q+': '+q+'DL'+q+',\n  '+q+'frontierland'+q+': '+q+'DL'+q+',\n  '+q+'bayou country'+q+': '+q+'DL'+q+',\n  '+q+'new orleans square'+q+': '+q+'DL'+q+',\n  '+q+'fantasyland'+q+': '+q+'DL'+q+',\n  '+q+'tomorrowland'+q+': '+q+'DL'+q+',\n  '+q+'mickeys toontown'+q+': '+q+'DL'+q+',\n  '+q+'main street usa'+q+': '+q+'DL'+q+',\n  '+q+'critter country'+q+': '+q+'DL'+q+',\n  '+q+'cars land'+q+': '+q+'DCA'+q+',\n  '+q+'avengers campus'+q+': '+q+'DCA'+q+',\n  '+q+'pixar pier'+q+': '+q+'DCA'+q+',\n  '+q+'grizzly peak'+q+': '+q+'DCA'+q+',\n  '+q+'paradise gardens park'+q+': '+q+'DCA'+q+',\n  '+q+'hollywood land'+q+': '+q+'DCA'+q+',\n  '+q+'buena vista street'+q+': '+q+'DCA'+q+',\n  '+q+'san fransokyo square'+q+': '+q+'DCA'+q+'\n};\n\nfunction tpcpParkOfLand(land) {\n  var key=(land||'+q+q+').toLowerCase().replace(/['+q+'\u2019\u2018]/g,'+q+q+').replace(/[.,]/g,'+q+q+').replace(/\\s+/g,'+q+' '+q+').trim();\n  return TPCP_LAND_PARK_NORM[key]||null;\n}";var o=c.slice(0,i)+r+c.slice(e);fs.writeFileSync('app.html',o);var d=fs.readFileSync('app.html');var na=0;for(var b of d)if(b>127)na++;var bl=(o.match(/{/g)||[]).length-(o.match(/}/g)||[]).length;console.log('na='+na+' bal='+bl);if(na!==479||bl!==-1)process.exit(1);console.log('DONE')"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "fix: normalize tpcpParkOfLand" || echo "Nothing to commit"
          git push
