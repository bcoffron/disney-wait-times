name: Fix tpcpParkOfLand

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: node -e "var fs=require('fs');var c=fs.readFileSync('app.html','utf8');var i=c.indexOf('TPCP_LAND_PARK = {');var e=c.indexOf('\nfunction tpcpTimeToMin');if(i<0||e<0){process.exit(1);}var r='TPCP_LAND_PARK_NORM = {\n  \x27star wars galaxys edge\x27: \x27DL\x27,\n  \x27adventureland\x27: \x27DL\x27,\n  \x27frontierland\x27: \x27DL\x27,\n  \x27bayou country\x27: \x27DL\x27,\n  \x27new orleans square\x27: \x27DL\x27,\n  \x27fantasyland\x27: \x27DL\x27,\n  \x27tomorrowland\x27: \x27DL\x27,\n  \x27mickeys toontown\x27: \x27DL\x27,\n  \x27main street usa\x27: \x27DL\x27,\n  \x27critter country\x27: \x27DL\x27,\n  \x27cars land\x27: \x27DCA\x27,\n  \x27avengers campus\x27: \x27DCA\x27,\n  \x27pixar pier\x27: \x27DCA\x27,\n  \x27grizzly peak\x27: \x27DCA\x27,\n  \x27paradise gardens park\x27: \x27DCA\x27,\n  \x27hollywood land\x27: \x27DCA\x27,\n  \x27buena vista street\x27: \x27DCA\x27,\n  \x27san fransokyo square\x27: \x27DCA\x27\n};\n\nfunction tpcpParkOfLand(land) {\n  var key=(land||\x27\x27).toLowerCase().replace(/[\x27\\u2019\\u2018]/g,\x27\x27).replace(/[.,]/g,\x27\x27).replace(/\\s+/g,\x27 \x27).trim();\n  return TPCP_LAND_PARK_NORM[key]||null;\n}";var o=c.slice(0,i)+r+c.slice(e);fs.writeFileSync('app.html',o);var d=fs.readFileSync('app.html');var na=0;for(var b of d)if(b>127)na++;var bl=(o.match(/{/g)||[]).length-(o.match(/}/g)||[]).length;console.log('na='+na+' bal='+bl);if(na!==479||bl!==-1)process.exit(1);console.log('DONE')"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "fix: normalize tpcpParkOfLand" || echo "Nothing to commit"
          git push
