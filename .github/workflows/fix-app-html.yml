name: Fix tpcpParkOfLand apostrophe normalization

on:
  workflow_dispatch:

  jobs:
    fix:
        runs-on: ubuntu-latest
            permissions:
                  contents: write
                      steps:
                            - name: Checkout
                                    uses: actions/checkout@v4
                                            with:
                                                      token: ${{ secrets.GITHUB_TOKEN }}

                                                            - name: Fix tpcpParkOfLand and TPCP_LAND_PARK in app.html
                                                                    run: |
                                                                              python3 - <<'PYEOF'
                                                                                        with open('app.html', 'r', encoding='utf-8') as f:
                                                                                                      content = f.read()
                                                                                                      
                                                                                                                old = (
                                                                                                                              "TPCP_LAND_PARK = {\n"
                                                                                                                                            "  'star wars: galaxy\\u2019s edge': 'DL',\n"
                                                                                                                                                          "  'adventureland': 'DL',\n"
                                                                                                                                                                        "  'frontierland': 'DL',\n"
                                                                                                                                                                                      "  'bayou country': 'DL',\n"
                                                                                                                                                                                                    "  'new orleans square': 'DL',\n"
                                                                                                                                                                                                                  "  'fantasyland': 'DL',\n"
                                                                                                                                                                                                                                "  'tomorrowland': 'DL',\n"
                                                                                                                                                                                                                                              "  'mickey\\u2019s toontown': 'DL',\n"
                                                                                                                                                                                                                                                            "  'main street, u.s.a.': 'DL',\n"
                                                                                                                                                                                                                                                                          "  'critter country': 'DL',\n"
                                                                                                                                                                                                                                                                                        "  'cars land': 'DCA',\n"
                                                                                                                                                                                                                                                                                                      "  'avengers campus': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                    "  'pixar pier': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                  "  'grizzly peak': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                "  'paradise gardens park': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                              "  'hollywood land': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                                            "  'buena vista street': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                                                          "  'san fransokyo square': 'DCA'\n"
                                                                                                                                                                                                                                                                                                                                                                                                        "};\n"
                                                                                                                                                                                                                                                                                                                                                                                                                      "\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                    "function tpcpParkOfLand(land) {\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                  "  return TPCP_LAND_PARK[(land || '').toLowerCase()] || null;\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                "}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    new = (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "TPCP_LAND_PARK_NORM = {\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "  'star wars galaxys edge': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "  'adventureland': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "  'frontierland': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "  'bayou country': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "  'new orleans square': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "  'fantasyland': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "  'tomorrowland': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "  'mickeys toontown': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "  'main street usa': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "  'critter country': 'DL',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "  'cars land': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "  'avengers campus': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "  'pixar pier': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "  'grizzly peak': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "  'paradise gardens park': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "  'hollywood land': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "  'buena vista street': 'DCA',\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "  'san fransokyo square': 'DCA'\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "};\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "function tpcpParkOfLand(land) {\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "  var key = (land || '')\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "    .toLowerCase()\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "    .replace(/['\\u2019\\u2018]/g, '')\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "    .replace(/[.,]/g, '')\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "    .replace(/\\s+/g, ' ')\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "    .trim();\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "  return TPCP_LAND_PARK_NORM[key] || null;\n"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            count = content.count(old)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      print(f"Found {count} occurrence(s) of old pattern")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if count != 1:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              raise ValueError(f"Expected exactly 1 occurrence, found {count}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        fixed = content.replace(old, new)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  remaining = fixed.count(old)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            print(f"Remaining old patterns: {remaining}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      # Verify new content is present
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                norm_count = fixed.count('TPCP_LAND_PARK_NORM')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          print(f"TPCP_LAND_PARK_NORM occurrences: {norm_count}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    with open('app.html', 'w', encoding='utf-8') as f:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  f.write(fixed)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            print("Done!")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      PYEOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: Verify integrity
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              python3 - <<'PYEOF'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        with open('app.html', 'rb') as f:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      data = f.read()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                non_ascii = sum(1 for b in data if b > 127)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          print(f"File size: {len(data)} bytes")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    print(f"Non-ASCII bytes (>127): {non_ascii}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # Brace balance
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        text = data.decode('utf-8')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  balance = text.count('{') - text.count('}')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            print(f"Brace balance: {balance}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      assert non_ascii == 479, f"Expected 479 non-ASCII bytes, got {non_ascii}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                assert balance == -1, f"Expected brace balance -1, got {balance}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          print("Integrity checks passed!")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    PYEOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Commit and push fix
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            git config user.name "github-actions[bot]"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                git add app.html
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          git commit -m "fix: normalize tpcpParkOfLand -- handle straight/curly apostrophes and Main Street USA
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Replace TPCP_LAND_PARK (curly-apostrophe keys) with TPCP_LAND_PARK_NORM (normalized keys).
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Strip apostrophes, periods, commas before lookup so Galaxy's Edge, Mickey's Toontown,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          and Main Street USA all resolve correctly regardless of apostrophe style."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    git push
